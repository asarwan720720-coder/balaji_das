<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Commission History</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:15px;
    font-family:Arial,sans-serif;
    background:#f2f2f2;
}

h2{
    text-align:center;
    margin:10px 0 20px;
}

.history-box{
    background:#fff;
    padding:12px;
    border-radius:10px;
    overflow-x:auto;
}

table{
    width:100%;
    min-width:650px;
    border-collapse:collapse;
}

th,
td{
    border:1px solid #ddd;
    padding:10px 8px;
    text-align:center;
}

th{
    background:#eee;
}

.commission{
    color:green;
    font-weight:bold;
}

.winning{
    color:#2196f3;
    font-weight:bold;
}

.total{
    font-weight:bold;
}

.no-data{
    text-align:center;
    padding:20px;
    color:#777;
}

</style>

</head>


<body>


<h2>Commission History</h2>


<div class="history-box">

    <div id="historyData">

        <div class="no-data">
            Loading...
        </div>

    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>


/* =========================
   SUPABASE
========================= */

const client = supabase.createClient(

    "https://katbdbzoufiblnnsoxkk.supabase.co",

    "sb_publishable_--fdpQMmSlUyt2ywjUErgQ_LXGvQH-a"

);


/* =========================
   LOAD COMMISSION HISTORY
========================= */

async function loadCommissionHistory(){

    const box =
        document.getElementById(
            "historyData"
        );


    /*
       User ID localStorage se
       li jayegi.
    */

    const userId =
        localStorage.getItem("userId");


    if(!userId){

        box.innerHTML =

            '<div class="no-data">User ID nahi mili.</div>';

        return;

    }


    /* =========================
       CURRENT USER KA REFER CODE
    ========================= */

    const { data: currentUser, error: currentUserError } =

        await client
        .from("login")
        .select("refer_code")
        .eq(
            "id",
            Number(userId)
        )
        .single();


    if(currentUserError || !currentUser){

        console.error(
            "Current User Error:",
            currentUserError
        );

        box.innerHTML =

            '<div class="no-data">User data nahi mila.</div>';

        return;

    }


    /* =========================
       CURRENT USER KI TEAM
       
       Team wahi hogi jinke
       referred_by me current
       user ka refer_code hai.
    ========================= */

    const { data: teamUsers, error: teamError } =

        await client
        .from("login")
        .select("id")
        .eq(
            "referred_by",
            currentUser.refer_code
        );


    if(teamError){

        console.error(
            "Team Error:",
            teamError
        );

        box.innerHTML =

            '<div class="no-data">Team load nahi hui.</div>';

        return;

    }


    /*
       Team ke user IDs
    */

    const teamIds =

        (teamUsers || [])
        .map(
            user => Number(user.id)
        );


    /*
       Agar team me koi user nahi hai
    */

    if(teamIds.length === 0){

        box.innerHTML =

            '<div class="no-data">Aapki team me abhi koi user nahi hai.</div>';

        return;

    }


    /* =========================
       COMMISSION HISTORY
       
       Sirf current user ko
       mili commission.
       
       Aur referral_id team ke
       kisi user ki honi chahiye.
    ========================= */

    const { data, error } =

        await client
        .from("commission_records")
        .select(
            "id,referral_id,commission_amount,winning_amount,total_amount,created_at"
        )
        .eq(
            "user_id",
            Number(userId)
        )
        .in(
            "referral_id",
            teamIds
        )
        .order(
            "created_at",
            {
                ascending:false
            }
        );


    if(error){

        console.error(
            "Commission History Error:",
            error
        );

        box.innerHTML =

            '<div class="no-data">History load nahi hui.</div>';

        return;

    }


    if(!data || data.length === 0){

        box.innerHTML =

            '<div class="no-data">Abhi koi commission history nahi hai.</div>';

        return;

    }


    /*
       Market name history table se
       aayega.
    */

    const referralIds =

        [
            ...new Set(
                data
                .map(
                    r => r.referral_id
                )
                .filter(Boolean)
            )
        ];


    let historyData = [];


    if(referralIds.length > 0){

        const { data: historyRows } =

            await client
            .from("history")
            .select(
                "user_id,market"
            )
            .in(
                "user_id",
                referralIds
            );


        historyData =
            historyRows || [];

    }


    let html = `

    <table>

        <thead>

            <tr>

                <th>ID</th>
                <th>Market</th>
                <th>Commission</th>
                <th>Winning</th>
                <th>Total</th>

            </tr>

        </thead>

        <tbody>

    `;


    data.forEach(record => {

        const matchingHistory =

            historyData.find(

                h =>

                Number(h.user_id) ===
                Number(record.referral_id)

            );


        let market =

            matchingHistory &&
            matchingHistory.market

            ? String(
                matchingHistory.market
              ).substring(0,2)

            : "-";


        html += `

        <tr>

            <td>
                ${record.referral_id ?? "-"}
            </td>

            <td>
                ${market}
            </td>

            <td class="commission">
                ₹${record.commission_amount ?? 0}
            </td>

            <td class="winning">
                ₹${record.winning_amount ?? 0}
            </td>

            <td class="total">
                ₹${record.total_amount ?? 0}
            </td>

        </tr>

        `;

    });


    html += `

        </tbody>

    </table>

    `;


    box.innerHTML = html;

}


/* =========================
   PAGE LOAD
========================= */

loadCommissionHistory();


</script>

</body>

</html>
