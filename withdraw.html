```html
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Withdraw</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:15px;
    font-family:Arial,sans-serif;
    background:#f2f2f2;
}

/* USER ID */

#userId{
    position:fixed;
    left:15px;
    top:10px;
    background:green;
    color:white;
    padding:8px 15px;
    border-radius:20px;
    font-weight:bold;
    z-index:10;
}

/* WALLET */

#wallet{
    position:fixed;
    right:15px;
    top:10px;
    background:red;
    color:white;
    padding:8px 15px;
    border-radius:20px;
    font-weight:bold;
    z-index:10;
}

/* CARD */

.card{
    background:white;
    padding:20px;
    border-radius:20px;
    margin-top:60px;
}

/* INPUT */

input{
    width:100%;
    padding:13px;
    margin-top:10px;
    border-radius:10px;
    border:1px solid #ccc;
    font-size:16px;
}

/* BUTTON */

.main-btn{
    width:100%;
    padding:15px;
    border:none;
    border-radius:15px;
    background:#ff4d4d;
    color:white;
    font-weight:bold;
    margin-top:15px;
    cursor:pointer;
    font-size:16px;
}

/* WITHDRAW HISTORY */

.history-card{
    background:#fff;
    padding:14px;
    border-radius:16px;
    margin-top:16px;
    box-shadow:0 3px 12px rgba(0,0,0,0.08);
}

.history-title{
    font-size:18px;
    font-weight:bold;
    margin-bottom:10px;
}

.withdraw-item{
    background:#f8f9fb;
    border:1px solid #e8e8e8;
    border-radius:12px;
    padding:11px 13px;
    margin-bottom:8px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
}

.amount{
    font-size:17px;
    font-weight:bold;
    color:#222;
}

.date{
    font-size:11px;
    color:#777;
    margin-top:3px;
}

.status{
    display:inline-block;
    padding:5px 9px;
    border-radius:15px;
    font-size:11px;
    font-weight:bold;
    white-space:nowrap;
}

.pending{
    background:#fff3cd;
    color:#9a6b00;
}

.accepted{
    background:#d9f7df;
    color:#16803c;
}

.rejected{
    background:#ffe0e0;
    color:#d22b2b;
}

.no-data{
    text-align:center;
    color:#777;
    padding:10px;
    font-size:13px;
}
/* STATUS */

.status{
    display:inline-block;
    padding:6px 12px;
    border-radius:20px;
    font-size:13px;
    font-weight:bold;
    margin-top:10px;
}

.pending{
    background:#fff3cd;
    color:#856404;
}

.accepted{
    background:#d4edda;
    color:#155724;
}

.rejected{
    background:#f8d7da;
    color:#721c24;
}

.no-data{
    text-align:center;
    color:#777;
    padding:15px;
}

</style>

</head>


<body>


<!-- USER ID -->

<div id="userId">
    ID: --
</div>


<!-- WALLET -->

<div id="wallet">
    ₹ 0
</div>


<!-- WITHDRAW FORM -->

<div class="card" id="step1">

    <h3>
        Withdraw Request
    </h3>

    <input
        type="number"
        id="amount"
        placeholder="Enter Amount"
    >

    <button
        class="main-btn"
        onclick="submitWithdraw()"
    >
        WITHDRAW
    </button>

</div>


<!-- WITHDRAW HISTORY -->

<div class="history-card">

    <div class="history-title">
        Withdraw History
    </div>

    <div id="withdrawHistory">

        <div class="no-data">
            Loading...
        </div>

    </div>

</div>


<script>


/* SUPABASE */

const client = supabase.createClient(

    "https://katbdbzoufiblnnsoxkk.supabase.co",

    "sb_publishable_--fdpQMmSlUyt2ywjUErgQ_LXGvQH-a"

);


/* LOGIN USER */

const user =
    JSON.parse(
        localStorage.getItem("user")
    );


/* LOAD USER */

async function loadUser(){

    if(!user){

        alert("Login required");

        return;

    }


    const {data,error} =

        await client
        .from("login")
        .select("balance")
        .eq("id",user.id)
        .single();


    if(error){

        console.log(error);

        return;

    }


    document.getElementById("wallet")
        .innerText =
        "₹ " + (data.balance || 0);


    document.getElementById("userId")
        .innerText =
        "ID: " + user.id;

}


/* SUBMIT WITHDRAW */

async function submitWithdraw(){

    if(!user){

        alert("Login required");

        return;

    }


    const amount =
        Number(
            document.getElementById("amount").value
        );


    if(!amount){

        alert("Amount daalo");

        return;

    }


    if(amount < 100){

        alert("Minimum Withdraw ₹100 hai ❌");

        return;

    }


    /* CHECK BALANCE */

    const {data,error} =

        await client
        .from("login")
        .select("balance")
        .eq("id",user.id)
        .single();


    if(error){

        console.log(error);

        alert("Balance check nahi hua");

        return;

    }


    const balance =
        Number(data.balance || 0);


    if(amount > balance){

        alert(
            "Wallet me itna balance nahi hai ❌"
        );

        return;

    }


    /*
       BALANCE MINUS
    */

    const newBalance =
        balance - amount;


    const {error:updateError} =

        await client
        .from("login")
        .update({
            balance:newBalance
        })
        .eq("id",user.id);


    if(updateError){

        console.log(updateError);

        alert("Balance update nahi hua");

        return;

    }


    /*
       WITHDRAW REQUEST
    */

    const {error:requestError} =

        await client
        .from("withdraw_requests")
        .insert({

            user_id:user.id,

            mobile:user.mobile,

            amount:amount,

            status:"pending"

        });


    if(requestError){

        console.log(requestError);

        alert(
            "Withdraw request create nahi hui"
        );

        return;

    }


    alert(
        "Withdraw request successfully sent ✅"
    );


    document.getElementById("amount")
        .value = "";


    loadUser();

    loadWithdrawHistory();

}


/* LOAD WITHDRAW HISTORY */

async function loadWithdrawHistory(){

    if(!user){

        return;

    }


    const historyBox =
        document.getElementById(
            "withdrawHistory"
        );


    historyBox.innerHTML =
        '<div class="no-data">Loading...</div>';


    const {data,error} =

        await client
        .from("withdraw_requests")
        .select(
            "id,amount,status,created_at"
        )
        .eq("user_id",user.id)
        .order(
            "created_at",
            {ascending:false}
        );


    if(error){

        console.log(error);

        historyBox.innerHTML =
            '<div class="no-data">History load nahi hui</div>';

        return;

    }


    if(!data || data.length === 0){

        historyBox.innerHTML =
            '<div class="no-data">Abhi koi withdraw request nahi hai</div>';

        return;

    }


    historyBox.innerHTML = "";


    data.forEach(item => {


        let status =
            String(item.status || "pending")
            .toLowerCase();


        let statusText =
            "Pending";


        let statusClass =
            "pending";


        if(
            status === "accepted" ||
            status === "accept" ||
            status === "clear" ||
            status === "cleared"
        ){

            statusText =
                "Accepted / Clear";

            statusClass =
                "accepted";

        }


        if(
            status === "rejected" ||
            status === "reject" ||
            status === "cancelled" ||
            status === "canceled"
        ){

            statusText =
                "Rejected / Cancel";

            statusClass =
                "rejected";

        }


        const date =
            item.created_at
            ? new Date(
                item.created_at
              ).toLocaleString(
                "en-IN"
              )
            : "--";


        const div =
            document.createElement("div");


        div.className =
            "withdraw-item";


        div.innerHTML = `

            <div class="amount">
                ₹ ${item.amount || 0}
            </div>

            <div class="date">
                ${date}
            </div>

            <div class="status ${statusClass}">
                ${statusText}
            </div>

        `;


        historyBox.appendChild(div);

    });

}


/* WITHDRAW TIMING */

function checkWithdrawTime(){

    const now =
        new Date();


    const hour =
        now.getHours();


    const minute =
        now.getMinutes();


    const currentMinutes =
        hour * 60 + minute;


    const offTime =
        0;


    const onTime =
        10 * 60 + 30;


    if(
        currentMinutes >= offTime &&
        currentMinutes < onTime
    ){

        document.getElementById(
            "step1"
        ).style.display =
            "none";


        let message =
            document.getElementById(
                "withdrawClosed"
            );


        if(!message){

            message =
                document.createElement(
                    "div"
                );


            message.id =
                "withdrawClosed";


            message.className =
                "card";


            message.innerHTML = `

                <h2 style="text-align:center;">
                    Withdraw Closed ⏰
                </h2>

                <p style="text-align:center;font-weight:bold;">
                    Withdraw abhi band hai.
                </p>

                <p style="text-align:center;">
                    Withdraw subah
                    <b>10:30 AM</b>
                    se dobara start hoga.
                </p>

            `;


            document.body.appendChild(
                message
            );

        }

    }else{

        const message =
            document.getElementById(
                "withdrawClosed"
            );


        if(message){

            message.remove();

        }


        document.getElementById(
            "step1"
        ).style.display =
            "block";

    }

}


/* START */

loadUser();

loadWithdrawHistory();

checkWithdrawTime();


/* TIME CHECK */

setInterval(
    checkWithdrawTime,
    1000
);


/*
   STATUS REFRESH
   हर 10 सेकंड में history
   दोबारा database से आएगी
*/

setInterval(
    loadWithdrawHistory,
    10000
);


</script>

</body>

</html>
