<!DOCTYPE html>
<html lang="hi">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Home</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
}

body{
  font-family:Arial, sans-serif;
  background:#f3f4f6;
  color:#222;
  padding-bottom:86px;
}


/* =========================
   TOP HEADER
========================= */

.topHeader{

  height:105px;

  background:
    linear-gradient(
      135deg,
      #e5b52e,
      #d19b19
    );

  position:relative;

  border-radius:0 0 24px 24px;

  box-shadow:
    0 4px 12px rgba(0,0,0,.18);

}


/* =========================
   MENU
========================= */

#menuBtn{

  position:absolute;

  left:18px;
  top:58px;

  width:42px;
  height:38px;

  display:flex;
  align-items:center;
  justify-content:center;

  color:white;

  font-size:28px;

  line-height:1;

  cursor:pointer;

  z-index:999;

}


/* =========================
   USER ID
========================= */

#userId{

  position:absolute;

  left:65px;

  top:57px;

  height:39px;

  min-width:95px;
  max-width:110px;

  display:flex;
  align-items:center;
  justify-content:center;

  background:white;

  color:#222;

  padding:0 12px;

  border-radius:22px;

  font-size:13px;

  font-weight:bold;

  overflow:hidden;

  white-space:nowrap;

  text-overflow:ellipsis;

  box-shadow:
    0 2px 7px rgba(0,0,0,.15);

}


/* =========================
   WALLET
========================= */

#wallet{

  position:absolute;

  left:56%;

  transform:translateX(-50%);

  top:57px;

  height:39px;

  min-width:100px;

  display:flex;

  align-items:center;

  justify-content:center;

  background:#fff;

  color:#222;

  padding:0 5px 0 15px;

  border-radius:22px;

  font-size:16px;

  font-weight:bold;

  box-shadow:
    0 2px 7px rgba(0,0,0,.15);

  cursor:pointer;

}


/* =========================
   HELP
========================= */

.helpBox{

  position:absolute;

  right:17px;
  top:53px;

  width:48px;

  color:white;

  text-align:center;

  font-size:12px;

  font-weight:bold;

  cursor:pointer;

}

.helpIcon{

  width:32px;
  height:32px;

  margin:auto;

  display:flex;

  align-items:center;
  justify-content:center;

  background:rgba(255,255,255,.18);

  border-radius:50%;

  font-size:20px;

  margin-bottom:2px;

}


/* =========================
   MAIN
========================= */

.main{

  width:100%;

  padding:14px 12px 20px;

}


/* =========================
   BANNER
========================= */

.banner{

  width:100%;

  height:190px;

  border-radius:18px;

  overflow:hidden;

  background:white;

  border:2px solid #171717;

  box-shadow:
    0 4px 12px rgba(0,0,0,.12);

  margin-bottom:17px;

}

.banner iframe{

  width:100%;
  height:100%;

  border:0;

  display:block;

}


/* =========================
   SLOGAN
========================= */

.slogan{

  background:white;

  border-radius:15px;

  padding:13px 0;

  font-size:18px;

  font-weight:bold;

  color:#e52b23;

  margin-bottom:17px;

  box-shadow:
    0 2px 8px rgba(0,0,0,.08);

  overflow:hidden;

  white-space:nowrap;

  position:relative;

}

.runningTrack{

  display:flex;

  width:max-content;

  animation:runningText 12s linear infinite;

}

.runningItem{

  display:inline-block;

  padding-right:50vw;

}

@keyframes runningText{

  from{
    transform:translateX(0);
  }

  to{
    transform:translateX(-50%);
  }

}

.slogan span{
  color:#d7a928;
}


/* =========================
   ACTION BAR
========================= */

.actionBar{

  display:grid;

  grid-template-columns:
    repeat(4,1fr);

  gap:8px;

  margin-bottom:20px;

}

.actionBtn{

  min-width:0;

  background:white;

  border:0;

  border-radius:17px;

  padding:10px 4px 9px;

  color:#222;

  text-align:center;

  font-weight:bold;

  cursor:pointer;

  box-shadow:
    0 2px 8px rgba(0,0,0,.09);

  transition:.15s;

}

.actionBtn:active{
  transform:scale(.94);
}

.actionIcon{

  width:48px;
  height:48px;

  margin:auto;

  border-radius:50%;

  display:flex;

  align-items:center;

  justify-content:center;

  font-size:27px;

  background:#fff5d0;

}

.actionText{

  margin-top:7px;

  font-size:12px;

  white-space:nowrap;

}


/* =========================
   GAME SECTION
========================= */

.container{

  width:100%;

  display:flex;

  flex-direction:column;

  gap:13px;

}


/* =========================
   GAME CARD
========================= */

.btn{

  width:100%;

  background:
    linear-gradient(
      145deg,
      #151922,
      #0d1016
    );

  border-radius:22px;

  padding:17px 15px 15px;

  text-align:center;

  color:white;

  border:none;

  overflow:hidden;

  box-shadow:
    0 5px 14px rgba(0,0,0,.20);

  transition:.15s;

}

.btn:active{
  transform:scale(.985);
}


/* =========================
   GAME TOP
========================= */

.gameTop{

  display:flex;

  justify-content:space-between;

  align-items:center;

  margin-bottom:13px;

}

.gameTimeLabel{

  color:#aaa;

  font-size:12px;

}

.gameTimeLabel span{

  color:#e5b52e;

  font-weight:bold;

}


/* =========================
   GAME NAME
========================= */

.gameName{

  background:
    linear-gradient(
      90deg,
      #171a21,
      #242933,
      #171a21
    );

  border:1px solid #30343d;

  border-radius:18px;

  padding:11px 8px;

  font-size:18px;

  font-weight:bold;

  color:white;

  margin-bottom:14px;

}


/* =========================
   NUMBERS
========================= */

.gameNumberRow{

  display:flex;

  justify-content:center;

  align-items:center;

  gap:13px;

}

.numberBox{

  width:110px;
  height:92px;

  background:#171c26;

  border:1px solid #292e38;

  border-radius:17px;

  display:flex;

  flex-direction:column;

  align-items:center;

  justify-content:center;

}

.gameNumber{

  font-size:28px;

  color:#f0cf55;

  font-weight:bold;

}

.numberLabel{

  font-size:12px;

  color:#999;

  margin-top:5px;

}

.arrow{

  font-size:30px;

  color:#777;

}


/* =========================
   STATUS
========================= */

.statusBox{

  width:100%;

  margin-top:14px;

  padding:12px;

  border-radius:15px;

  background:
    linear-gradient(
      90deg,
      #ffe48a,
      #b88820
    );

  color:#111;

  font-size:18px;

  font-weight:bold;

}


/* =========================
   WHATSAPP
========================= */

.whatsapp{

  position:fixed;

  right:15px;

  bottom:96px;

  width:52px;
  height:52px;

  background:#25D366;

  border-radius:50%;

  display:flex;

  align-items:center;

  justify-content:center;

  color:white;

  font-size:27px;

  text-decoration:none;

  z-index:500;
